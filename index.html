const fields={};let current=0;const pages=[];let selected=null;const el=(tag,cls,html)=>{let e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e};function addField(parent,label,id,type='text',wide=false){let w=el('div','field'+(wide?' wide':''));let l=el('label','',label);let i=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea')i.type=type;if(type==='date'){i.lang='es-AR';i.addEventListener('click',()=>{if(typeof i.showPicker==='function')try{i.showPicker()}catch(e){}})}i.id=id;i.dataset.key=id;i.classList.add('custom-field');i.addEventListener('focus',()=>selectField(i));w.append(l,i);parent.append(w);fields[id]=i;return i}function section(page,title){let s=el('section','section');s.append(el('h2','',title));let inner=el('div','inner');s.append(inner);page.append(s);return inner}function grid(p,three=false){let g=el('div','grid'+(three?' three':''));p.append(g);return g}function checks(parent,items,key,mode='multi'){let c=el('div','checks');items.forEach((t,n)=>{let lab=el('label');let inp=document.createElement('input');inp.type='checkbox';inp.dataset.key=key+'_'+n;inp.dataset.group=mode==='single'?key:'';inp.addEventListener('change',()=>{if(inp.checked&&mode==='single')document.querySelectorAll('[data-group="'+key+'"]').forEach(x=>{if(x!==inp)x.checked=false})});fields[inp.dataset.key]=inp;lab.append(inp,document.createTextNode(t));c.append(lab)});parent.append(c);return c}function question(parent,title,key,extra=false){let r=el('div','qrow');r.append(el('span','question-title',title));checks(r,['Sí','No'],key,'single');parent.append(r);if(extra)addField(parent,extra,key+'_detalle')}function multi(parent,title,items,key){let w=el('div','qdetail');w.append(el('div','question-title',title));checks(w,items,key);parent.append(w)}function sheet(n,desc){let p=el('article','sheet');p.append(el('header','',`<div class="brand">AURA ESTÉTICA</div><div class="subtitle">BELLEZA · BIENESTAR</div><h1>FICHA COSMETOLÓGICA</h1><p>${desc}</p>`));pages.push(p);document.getElementById('pages').append(p);return p}function selectField(f){selected=f;document.getElementById('fontSize').value=parseInt(f.style.fontSize)||16;document.getElementById('fontColor').value=rgbToHex(f.style.color)||'#29251f';document.getElementById('bold').classList.toggle('active',f.style.fontWeight==='700')}function rgbToHex(c){if(!c)return null;if(c[0]==='#')return c;let m=c.match(/\d+/g);return m?'#'+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,'0')).join(''):null}function format(){if(!selected)return;selected.style.fontSize=document.getElementById('fontSize').value+'px';selected.style.color=document.getElementById('fontColor').value}document.getElementById('fontSize').onchange=format;document.getElementById('fontColor').oninput=format;document.getElementById('bold').onclick=()=>{if(!selected)return;selected.style.fontWeight=selected.style.fontWeight==='700'?'400':'700';selectField(selected)};
let p=sheet(1,'01 · DATOS Y ANTECEDENTES');let a=section(p,'01 / DATOS PERSONALES');let g=grid(a);[['Nombre y apellido','nombre'],['Fecha de nacimiento','nacimiento','date'],['Edad','edad'],['DNI','dni'],['Teléfono','telefono'],['Email','email'],['Domicilio','domicilio'],['Localidad','localidad'],['Ocupación','ocupacion'],['Fecha de ficha','fecha','date']].forEach(x=>addField(g,...x));multi(a,'¿Cómo se enteró del centro?',['Redes sociales','Recomendación','Publicidad','Otro'],'origen');addField(a,'Si marcó otro, especificar','origen_otro');a=section(p,'02 / ANTECEDENTES CLÍNICOS');[['¿Tiene hipertensión arterial?','hipertension'],['¿Tiene diabetes?','diabetes'],['¿Padece enfermedades crónicas?','cronicas','¿Cuáles?'],['¿Toma medicación actualmente?','medicacion','¿Cuál?'],['¿Es alérgica/o?','alergia','¿A qué?'],['¿Fuma?','fuma'],['¿Consume alcohol?','alcohol','Frecuencia'],['¿Está embarazada o en lactancia?','embarazo'],['¿Tiene antecedentes de cáncer de piel?','cancer','¿Cuáles?'],['¿Tuvo cirugías recientes?','cirugias','¿Cuáles?']].forEach(x=>question(a,...x));a=section(p,'03 / CICLO MENSTRUAL (SI CORRESPONDE)');question(a,'¿Tiene ciclos regulares?','ciclos');addField(a,'Fecha de última menstruación','ultima_menstruacion','date');
p=sheet(2,'02 · CONSULTA Y EVALUACIÓN CUTÁNEA');a=section(p,'05 / MOTIVO DE CONSULTA');multi(a,'¿Qué desea tratar?',['Acné','Rosácea','Manchas','Arrugas','Limpieza profunda','Hidratación','Sensibilidad','Flacidez','Otro'],'motivo');addField(a,'Otro motivo / expectativas','motivo_otro');[['¿Utiliza ácidos, retinoides, vitamina C, despigmentantes o exfoliantes?','activos','¿Cuáles?'],['¿Tiene exposición solar frecuente?','sol'],['¿Utiliza protector solar diariamente?','protector'],['¿Usa cabina solar?','cabina'],['¿Tuvo reacciones adversas a tratamientos anteriores?','reacciones','¿Cuáles?']].forEach(x=>question(a,...x));g=grid(a);addField(g,'Último tratamiento facial realizado','ultimo_tratamiento');addField(g,'Fecha aproximada','fecha_tratamiento','date');a=section(p,'06 / ANTECEDENTES DERMATOLÓGICOS Y EVALUACIÓN INICIAL');let categories=[['Antecedentes dermatológicos',['Acné','Rosácea','Dermatitis','Manchas','Melasma','Psoriasis','Otro'],'derma'],['Tipo de piel',['Normal','Seca','Grasa','Mixta','Sensible'],'tipo'],['Biotipo cutáneo',['Alípica','Seborreica','Deshidratada','Mixta'],'biotipo'],['Estado de la piel',['Sensible','Deshidratada','Fotoenvejecida','Con arrugas','Flacidez','Engrosamiento','Buena'],'estado'],['Fototipo cutáneo',['I','II','III','IV','V','VI'],'fototipo'],['Alteraciones observadas',['Comedones abiertos','Comedones cerrados','Pápulas','Pústulas','Manchas','Cicatrices','Poros dilatados','Telangiectasias','Eritema','Descamación','Ojeras'],'alteraciones']];let cg=el('div','choices');a.append(cg);categories.forEach(([title,items,key])=>{let c=el('div','choice');c.append(el('strong','',title));checks(c,items,key,key==='tipo'||key==='biotipo'||key==='fototipo'?'single':'multi');cg.append(c)});addField(a,'Otras alteraciones / observaciones','otras_alteraciones','textarea');a=section(p,'07 / EVALUACIÓN PROFESIONAL');g=grid(a);[['Diagnóstico cosmetológico','diagnostico'],['Objetivo del tratamiento','objetivo'],['Tratamiento indicado / protocolo','protocolo'],['Frecuencia sugerida de sesiones','frecuencia']].forEach(x=>addField(g,...x,'textarea'));addField(a,'Observaciones profesionales','observaciones','textarea');
p=sheet(3,'03 · SEGURIDAD, TRATAMIENTO Y SEGUIMIENTO');a=section(p,'08 / CONTRAINDICACIONES PARA TRATAMIENTOS');[['¿Se realizó bótox?','botox','¿Cuándo?'],['¿Se realizó rellenos con ácido hialurónico?','rellenos','¿Cuándo?'],['¿Utiliza retinoides orales (isotretinoína)?','isotretinoina'],['¿Tiene infecciones cutáneas activas?','infecciones'],['¿Se realizó peelings o láser recientemente?','peelings','¿Cuándo?'],['¿Presenta heridas, quemaduras o irritaciones activas?','heridas']].forEach(x=>question(a,...x));a=section(p,'09 / PLAN Y CUIDADO DOMICILIARIO');addField(a,'Productos recomendados (uso domiciliario)','productos','textarea');multi(a,'Apoyo domiciliario',['Indicado','No indicado','Se entrega hoja aparte'],'apoyo');addField(a,'Indicaciones adicionales / seguimiento','seguimiento','textarea');a=section(p,'10 / SESIONES PROGRAMADAS');g=grid(a,true);for(let i=1;i<=8;i++)addField(g,'Sesión '+i+' · Fecha','sesion_'+i,'date');a=section(p,'11 / CONSENTIMIENTO Y FIRMAS');a.append(el('p','note','Declaro que los datos aportados son verdaderos y autorizo la realización del tratamiento cosmetológico indicado según evaluación profesional. La profesional debe explicar el procedimiento, sus riesgos y cuidados, y solicitar el consentimiento correspondiente.'));multi(a,'Consentimiento',['Leí y comprendí la información','Autorizo el tratamiento propuesto'],'consentimiento');g=grid(a);[['Nombre y firma de la clienta/e','firma_cliente'],['Firma profesional','firma_profesional']].forEach(x=>addField(g,...x));addField(g,'Fecha','fecha_firma','date');

{const dobLabels=[...document.querySelectorAll('.field > label')].filter(label=>label.textContent.trim()==='Fecha de nacimiento');dobLabels.slice(1).forEach(label=>{const field=label.closest('.field');if(field){const input=field.querySelector('[data-key]');if(input)delete fields[input.dataset.key];field.remove()}})}
pages.forEach((x,i)=>x.append(el('div','footer','PIEL FELIZ · PERSONAS MÁS SEGURAS  ♡  AURA ESTÉTICA  ·  '+(i+1)+' / 3')));function show(n){current=Math.max(0,Math.min(2,n));pages.forEach((p,i)=>p.classList.toggle('hidden',i!==current));document.getElementById('count').textContent='Página '+(current+1)+' de 3';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===2;window.scrollTo(0,0)}document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);show(0);
function snapshot(){let values={};Object.entries(fields).forEach(([k,e])=>values[k]={value:e.type==='checkbox'?e.checked:e.value,size:e.style.fontSize,color:e.style.color,weight:e.style.fontWeight});return {format:'aura-estetica-v1',saved:new Date().toISOString(),values}}function restore(data){if(!data||data.format!=='aura-estetica-v1'||!data.values)throw Error('Archivo de ficha no válido');Object.entries(data.values).forEach(([k,v])=>{let e=fields[k];if(!e)return;if(e.type==='checkbox')e.checked=!!v.value;else e.value=v.value||'';e.style.fontSize=v.size||'';e.style.color=v.color||'';e.style.fontWeight=v.weight||''})}function download(content,name,type){let blob=new Blob([content],{type});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}function slug(s){return (s||'clienta').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'_').slice(0,45)}function saveCompleteHTML(){
 const clone=document.documentElement.cloneNode(true);
 const old=clone.querySelector('#saved-state');if(old)old.remove();

 state.textContent=JSON.stringify(snapshot()).replace(/</g,'\\u003c');
 clone.querySelector('body').appendChild(state);
 const html='<!doctype html>\n'+clone.outerHTML;
 download(html,'Aura_Estetica_'+slug(fields.nombre.value)+'.html','text/html;charset=utf-8');
 document.getElementById('status').textContent='Ficha completa guardada ✓';
}
window.addEventListener('DOMContentLoaded',()=>{const embedded=document.getElementById('saved-state');if(embedded){try{restore(JSON.parse(embedded.textContent));document.getElementById('status').textContent='Ficha guardada recuperada ✓'}catch(e){console.warn(e)}}});
document.getElementById('save').onclick=saveCompleteHTML;
document.getElementById('load').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{restore(JSON.parse(await f.text()));document.getElementById('status').textContent='Ficha recuperada ✓';show(0)}catch(err){alert('No se pudo abrir: '+err.message)}e.target.value=''};document.getElementById('pdf').onclick=()=>window.print();document.getElementById('new').onclick=()=>{if(!confirm('¿Crear una ficha vacía? Guardá la actual antes de continuar.'))return;Object.values(fields).forEach(e=>{if(e.type==='checkbox')e.checked=false;else e.value='';e.removeAttribute('style')});show(0)};

function detailInput(key){return fields[key+'_detalle']||null}
function makeAutocomplete(input,items){if(!input)return;input.setAttribute('autocomplete','off');input.placeholder='Escribí para buscar…';const field=input.closest('.field');field.classList.add('autocomplete-wrap');const menu=document.createElement('div');menu.className='autocomplete-menu';field.appendChild(menu);
